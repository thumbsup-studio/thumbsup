display_information:
  name: PM봇
  description: 떰즈업 팀 명세 Q&A · 대화 수집 봇
  background_color: "#2c2d30"
features:
  bot_user:
    # ASCII만 허용 — Slack 사용자명으로 변환 가능해야 한다(한글 불가).
    # 채널에서는 @pm-bot 으로 멘션한다.
    display_name: pm-bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read # app_mention 이벤트 구독에 필수
      - channels:history
      - channels:read
      - chat:write
      - reactions:read
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - reaction_added
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
