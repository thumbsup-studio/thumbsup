name: Server CI

# 주의: on.pull_request에 paths 필터를 걸면, server/를 건드리지 않는 PR(예: 프론트 전용 PR)에서는
# 이 워크플로우 자체가 트리거되지 않아 "필수 상태 체크"가 영원히 대기 상태로 남아 머지가 막힌다.
# 그래서 워크플로우는 모든 PR에서 트리거하고, 잡 내부에서 server/ 변경 여부를 판단해 스킵한다.
on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: server
        run: chmod +x gradlew

      - name: Build and test (compile, unit/integration tests, ArchUnit, Spotless, Checkstyle)
        working-directory: server
        run: ./gradlew build

  gitleaks:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Gitleaks secret scan
        run: docker run --rm -v "$(pwd):/repo" zricethezav/gitleaks:latest detect --source /repo --no-git -v
