name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

permissions:
  id-token: write # OIDC로 AWS 자격 증명 임시 위임받기 위해 필요
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: thumbsup-server
  ECR_REGISTRY: 819743217770.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::819743217770:role/thumbsup-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: server
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,AWS_REGION
          script: |
            aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY
            sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest
            sudo docker stop thumbsup-server 2>/dev/null || true
            sudo docker rm thumbsup-server 2>/dev/null || true
            # host 네트워크 사용 — EC2 인스턴스 메타데이터(IMDS) 홉 제한 문제 없이 IAM 역할 자격 증명을 그대로 상속받기 위함
            sudo docker run -d --name thumbsup-server --restart unless-stopped --network host \
              -e SPRING_PROFILES_ACTIVE=prod -e AWS_REGION=$AWS_REGION \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest
