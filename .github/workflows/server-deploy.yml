name: Deploy Server

# TODO: server/ 프로젝트가 올라오면 이 워크플로우가 정상 동작하는지 확인할 것
on:
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'

      - name: Grant execute permission for gradlew
        working-directory: server
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: server
        run: ./gradlew build -x test

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'server/build/libs/*.jar'
          target: '/home/ec2-user/app'
          strip_components: 2

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            # Gradle의 Spring Boot 플러그인은 -plain.jar(순수 클래스)와 실행용 fat jar를 함께 만듦 — 실행용만 골라 app.jar로 교체
            find . -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -exec mv {} app.jar \;
            sudo systemctl restart thumbsup
