name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '!server/docs/**'
      - '!server/**/*.md'

concurrency:
  group: server-deploy-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions:
  id-token: write # OIDC로 AWS 자격 증명 임시 위임받기 위해 필요
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: thumbsup-server
  ECR_REGISTRY: 819743217770.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::819743217770:role/thumbsup-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: server
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,AWS_REGION,IMAGE_TAG
          script: |
            set -e
            aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY
            # latest가 아닌 이번 빌드의 커밋 SHA 태그를 명시적으로 pull — 빌드 후 다른 push가 latest를 덮어써도 이번 배포와 무관하게 유지
            sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            sudo docker stop thumbsup-server 2>/dev/null || true
            sudo docker rm thumbsup-server 2>/dev/null || true
            # host 네트워크 사용 — EC2 인스턴스 메타데이터(IMDS) 홉 제한 문제 없이 IAM 역할 자격 증명을 그대로 상속받기 위함
            sudo docker run -d --name thumbsup-server --restart unless-stopped --network host \
              -e SPRING_PROFILES_ACTIVE=prod -e AWS_REGION=$AWS_REGION \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "헬스체크 대기 중..."
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "헬스체크 통과"
                # 배포마다 커밋 SHA로 새 이미지를 pull하는데 지금까지 정리 단계가 없어 EC2 로컬 디스크가
                # 계속 쌓였다(#311, 8GB 볼륨이 이미지 55개·5.5GB로 97% 참). 방금 살아난 컨테이너 말고는
                # 전부 미사용 이미지이므로 안전하게 지운다 — ECR엔 모든 태그가 그대로 남아 필요하면 재pull 가능.
                sudo docker image prune -a -f
                exit 0
              fi
              sleep 2
            done
            echo "헬스체크 실패 (60초 초과) — 컨테이너 로그:"
            sudo docker logs thumbsup-server --tail 100
            # 실패한 배포 직전의 구 이미지는 지우지 않는다 — 수동 롤백(직전 태그로 재기동)이 가능해야 한다.
            exit 1
