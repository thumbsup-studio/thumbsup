name: Mobile PR Bundle Publish

on:
  workflow_run:
    workflows: [Mobile PR Bundle Build]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: pr-publish-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mobile-staging-publish
    env:
      ARTIFACTS_BUCKET: ${{ vars.MOBILE_ARTIFACTS_BUCKET }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 신뢰된 도구 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 빌드 artifact 다운로드
        uses: actions/download-artifact@v4
        with:
          name: pr-bundle-${{ github.event.workflow_run.pull_requests[0].number }}
          path: ${{ runner.temp }}/pr-bundle
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: AWS 최소 권한 역할 위임
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.MOBILE_STAGING_PUBLISH_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: PR 채널 원자적 publish
        run: >-
          pnpm --filter updates-server publish:pr -- publish
          --artifact-dir "$RUNNER_TEMP/pr-bundle"
          --bucket "$ARTIFACTS_BUCKET"
          --pr "$PR_NUMBER"
          --commit "$HEAD_SHA"
      - name: PR에 staging 딥링크 안내
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- mobile-pr-bundle -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const deepLink = `thumbsup-staging://pr/${issue_number}`;
            const body = `${marker}\n### 모바일 PR 번들\n\n[staging 앱에서 열기](${deepLink})\n\n\`${deepLink}\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
