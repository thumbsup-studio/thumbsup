name: Web Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - '.github/workflows/web-deploy.yml'

  deploy:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 시크릿 가드 (fork PR·미등록 시 스킵)
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN 미설정 — 배포를 건너뜁니다"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 워크스페이스 의존성 설치
        if: steps.guard.outputs.skip != 'true'
        run: pnpm --dir ../.. install --frozen-lockfile
      - name: Vercel 배포
        id: deploy
        if: steps.guard.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then FLAG="--prod"; ENV_NAME="production"; else FLAG=""; ENV_NAME="preview"; fi
          npx vercel@54 pull --yes --environment=$ENV_NAME --token="$VERCEL_TOKEN"
          npx vercel@54 build $FLAG --token="$VERCEL_TOKEN"
          mv .vercel ../../.vercel
          URL=$(npx vercel@54 --cwd ../.. deploy --prebuilt $FLAG --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "배포 완료: $URL"

  preview-comment:
    needs: deploy
    if: github.event_name == 'pull_request' && needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🔍 **프리뷰 배포**: ${{ needs.deploy.outputs.url }}

            `apps/web/**` 변경이 반영된 미리보기입니다. 푸시할 때마다 갱신됩니다.
