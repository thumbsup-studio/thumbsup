# 전 환경 공통 설정만 둔다. 환경별 값과 SSM import는 application-{profile}.yml
spring:
  application:
    name: thumbsup-server
  profiles:
    default: local # 프로파일 미지정 실행 = local
  jpa:
    open-in-view: false # OSIV off — 트랜잭션 경계는 Service에서 끝난다
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 마이그레이션으로만
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # DB 저장은 UTC, API 직렬화만 KST(+09:00) — docs/api-standard.md

thumbsup:
  jwt:
    access-token-validity: 30m # 계약: docs/api-standard.md §8 (secret은 환경별 — 여기 두지 않는다)
    refresh-token-validity: 14d # 계약: docs/api-standard.md §8
  authoring:
    admin-emails: [] # 저작 관리자 사전 지정(#174 C1) — 비어 있으면 로그인 self-heal 승격 없음 (시크릿 아님, fail-fast 대상 아님)

server:
  port: 8080
  shutdown: graceful

logging:
  pattern:
    level: "%5p [rid:%X{requestId:-}]" # RequestIdFilter가 채우는 요청 추적 ID

management:
  endpoints:
    web:
      exposure:
        include: health # 외부 노출은 health만 (배포 헬스체크: /actuator/health)
