# 전 환경 공통 설정만 둔다. 환경별 값은 application-{profile}.yml
# ⚠️ SSM import는 application-prod.yml에만 — 여기 넣으면 로컬 부팅이 AWS 자격증명을 요구하며 실패
spring:
  application:
    name: thumbsup-server
  profiles:
    default: local # 프로파일 미지정 실행 = local
  jpa:
    open-in-view: false # OSIV off — 트랜잭션 경계는 Service에서 끝난다
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 마이그레이션으로만
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # DB 저장은 UTC, API 직렬화만 KST(+09:00) — docs/api-standard.md

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health # 외부 노출은 health만 (배포 헬스체크: /actuator/health)
