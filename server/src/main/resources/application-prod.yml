# 운영 — 설정·시크릿은 부팅 시 SSM Parameter Store에서 주입 (server/docs/env-guide.md)
# 시크릿 프로퍼티에 default 값 금지 (fail-fast): 없으면 부팅 실패가 안전하다
spring:
  config:
    import: "aws-parameterstore:/thumbsup/prod/"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# 운영 Swagger/OpenAPI는 FE 협업용으로 켜되 SecurityConfig에서 Basic Auth로 보호한다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

thumbsup:
  jwt:
    secret: ${JWT_SECRET} # SSM SecureString
  cors:
    # 콤마 구분 목록 — 예: https://thumbsup-app.vercel.app,https://*-thumbsup.vercel.app
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}
  swagger:
    basic-auth:
      username: ${SWAGGER_USERNAME} # SSM: /thumbsup/prod/SWAGGER_USERNAME
      password: ${SWAGGER_PASSWORD} # SSM SecureString: /thumbsup/prod/SWAGGER_PASSWORD
  authoring:
    # 콤마 구분 이메일 목록(#174 C1) — SSM: /thumbsup/prod/AUTHORING_ADMIN_EMAILS. 시크릿이 아니라 default 빈 값 허용
    # (파라미터가 아직 없으면 자동 승격이 없을 뿐 배포는 막지 않는다).
    # ⚠️ 이 값은 부팅 시점에만 SSM에서 읽는다 — 파라미터를 갱신해도 컨테이너를 재기동(재배포)해야 반영된다 (#209).
    admin-emails: ${AUTHORING_ADMIN_EMAILS:}
