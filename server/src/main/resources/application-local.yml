# 로컬 개발 전용 — 값은 docker-compose.yml의 MySQL과 한 쌍 (시크릿 아님)
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/thumbsup?serverTimezone=UTC&characterEncoding=UTF-8
    username: thumbsup
    password: thumbsup-local
  cloud:
    aws:
      parameterstore:
        # 로컬에선 SSM 통합 완전 비활성 — 켜두면 SsmClient 생성 시 AWS region을
        # 요구해 (호스트 ~/.aws가 없는) 깨끗한 환경·CI에서 부팅이 실패한다
        enabled: false

thumbsup:
  jwt:
    secret: thumbsup-local-dev-only-secret-never-use-in-prod-32bytes # 로컬 전용 (시크릿 아님)
  cors:
    allowed-origin-patterns:
      - http://localhost:3000 # Next.js 개발 서버 — docs/api-standard.md §9
