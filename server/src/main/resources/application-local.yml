# 로컬 개발 전용 — DB 값은 docker-compose.yml의 MySQL과 한 쌍 (시크릿 아님)
# JWT/Swagger 계정 등 공유 시크릿은 /thumbsup/local/ SSM에서 주입한다.
spring:
  config:
    import: "aws-parameterstore:/thumbsup/local/"
  datasource:
    url: jdbc:mysql://localhost:3306/thumbsup?serverTimezone=UTC&characterEncoding=UTF-8
    username: thumbsup
    password: thumbsup-local

thumbsup:
  jwt:
    secret: ${JWT_SECRET} # SSM SecureString: /thumbsup/local/JWT_SECRET
  cors:
    allowed-origin-patterns:
      - http://localhost:3000 # Next.js 개발 서버 — docs/api-standard.md §9
  swagger:
    basic-auth:
      username: ${SWAGGER_USERNAME} # SSM: /thumbsup/local/SWAGGER_USERNAME
      password: ${SWAGGER_PASSWORD} # SSM SecureString: /thumbsup/local/SWAGGER_PASSWORD
  authoring:
    admin-emails:
      - admin@thumbsup.local # 로컬 개발용 저작 관리자 계정(#174 C1) — 이 이메일로 회원가입 후 로그인하면 ADMIN 승격
