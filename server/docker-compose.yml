# 서버 개발자 기본 경로: docker compose up -d mysql 후 ./gradlew bootRun
# app 서비스는 Docker 이미지 동작 확인용이며 local SSM을 읽기 위해 AWS profile이 필요하다.
services:
  mysql:
    image: mysql:8.4 # 운영 RDS와 버전 일치 유지 (server/docs/ci-requirements.md)
    container_name: thumbsup-mysql
    environment:
      MYSQL_DATABASE: thumbsup
      MYSQL_USER: thumbsup
      MYSQL_PASSWORD: thumbsup-local # 로컬 전용 값 — application-local.yml과 한 쌍
      MYSQL_ROOT_PASSWORD: root-local
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uthumbsup", "-pthumbsup-local"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: thumbsup-server
    ports:
      - "8080:8080"
    environment:
      HOME: /home/appuser
      SPRING_PROFILES_ACTIVE: local
      # 컨테이너 안에서는 localhost가 아니라 mysql 서비스명으로 접속
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/thumbsup?serverTimezone=UTC&characterEncoding=UTF-8
      AWS_PROFILE: ${AWS_PROFILE:-thumbsup}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-2}
      AWS_CONFIG_FILE: /home/appuser/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /home/appuser/.aws/credentials
    # Linux에서 ~/.aws가 700/600 권한이면 LOCAL_UID/LOCAL_GID를 호스트 사용자 값으로 맞춘다.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - type: bind
        source: ${AWS_CONFIG_DIR:-${HOME:-${USERPROFILE:-}}/.aws}
        target: /home/appuser/.aws
        read_only: true
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
