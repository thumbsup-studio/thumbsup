appId: ${APP_ID}
name: Native - Android offline recovery
tags: [mobile-native, android]
---
- launchApp:
    clearState: true
- setAirplaneMode: enabled
- tapOn:
    text: "이메일"
    index: 1
- inputText: ${E2E_EMAIL}
- hideKeyboard
- tapOn:
    text: "비밀번호"
    index: 1
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "로그인"
- assertVisible: "네트워크에 연결할 수 없어요.*"
- setAirplaneMode: disabled
